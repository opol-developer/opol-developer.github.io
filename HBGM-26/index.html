<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Bà Ngoại</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Google Material Icons (Material Symbols Outlined) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="res/style.css">
</head>
<body>

    <div class="main-card">
        <!-- HEADER -->
        <header class="header">
            <h1 class="script-title">Grandma's Birthday</h1>
            <p class="subtitle">TRONG ĐỜI ĐƯỢC MẤY LẦN SINH NHẬT.</p>
        </header>

        <!-- PHẦN MÁY ĐĨA THAN -->
        <section class="turntable-section">
            <div class="player-container">
                
                <!-- BÀN XOAY & ĐĨA THAN -->
                <div class="platter-area" id="platterArea" title="Nhấn để phát / tạm dừng">
                    <div class="record" id="record">
                        <div class="record-grooves"></div>
                        <div class="record-label" id="recordLabel">
                            <span class="material-symbols-outlined music-note-icon">music_note</span>
                        </div>
                        <div class="center-hole"></div>
                    </div>

                    <!-- CẦN GẠT KIM -->
                    <div class="tonearm-assembly" id="tonearm">
                        <div class="tonearm-base"></div>
                        <div class="tonearm-arm"></div>
                        <div class="tonearm-cartridge"></div>
                    </div>
                </div>

                <!-- THÔNG TIN BÀI HÁT & NÚT BẤM -->
                <div class="controls-bar">
                    <div class="song-info">
                        <div class="song-title" id="songTitle">Đang tải nhạc...</div>
                        <div class="song-artist" id="songArtist">--</div>
                    </div>

                    <div class="btn-group">
                        <button class="btn" id="prevBtn" title="Bài trước">
                            <span class="material-symbols-outlined">skip_previous</span>
                        </button>
                        <button class="btn btn-play" id="playBtn" title="Phát / Dừng">
                            <span class="material-symbols-outlined icon-play" id="playIcon">play_arrow</span>
                        </button>
                        <button class="btn" id="nextBtn" title="Bài tiếp">
                            <span class="material-symbols-outlined">skip_next</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- LÁ THƯ VIẾT TAY -->
        <section class="letter-section">
            <div class="letter-header">
                <span class="material-symbols-outlined stamp-icon">mail</span>
                <span class="letter-title">Thư Gửi Bà Ngoại</span>
            </div>
            
            <div id="letterContent" class="letter-body">
                <p style="text-align: center; color: #5D0703;"><u>Đang tải nội dung lá thư...</u></p>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <p>Kính chúc Bà Ngoại luôn mạnh khỏe, hạnh phúc và an nhiên ♥</p>
        </footer>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="res/app.js"></script>
</body>
</html>
